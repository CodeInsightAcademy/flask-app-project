name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write  # <-- This gives GITHUB_TOKEN permission to push
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./  # Adjust this if your HTML is inside a subfolder

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v2
